<html lang="en">

    <title>Buku Resep Nusantara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script type="module" crossorigin src="/capston-resep/assets/index-Xrds5sEO.js"></script>
    <link rel="stylesheet" crossorigin href="/capston-resep/assets/index-CDXxarT2.css">

  <body>
    <div id="root"></div>
    <script src="/capston-resep/js/theme.js"></script>
    <script src="/capston-resep/js/toast.js"></script>
    <script src="/capston-resep/js/loading.js"></script>
    <script src="/capston-resep/js/storage.js"></script>
    <script>
      // Animasi reveal berbasis IntersectionObserver (JavaScript murni, tanpa library)
      (function () {
        var REVEAL = 'reveal'
        var VISIBLE = 'reveal-visible'

        function revealAll() {
          document.querySelectorAll('.' + REVEAL).forEach(function (el) {
            el.classList.add(VISIBLE)
          })
        }

        if (!('IntersectionObserver' in window)) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', revealAll)
          } else {
            revealAll()
          }
          return
        }

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add(VISIBLE)
              io.unobserve(entry.target)
            }
          })
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' })

        function track() {
          document.querySelectorAll('.' + REVEAL + ':not(.' + VISIBLE + ')').forEach(function (el) {
            io.observe(el)
          })
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', track)
        } else {
          track()
        }

        // Awasi konten dinamis yang ditambahkan React / JS
        var timer = null
        var mo = new MutationObserver(function () {
          clearTimeout(timer)
          timer = setTimeout(track, 120)
        })
        mo.observe(document.documentElement, { childList: true, subtree: true })
      })()
    </script>
  </body>
</html>
